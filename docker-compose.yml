services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: photo-gallery-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: photo-gallery
    ports:
      - "27017:27017"
    volumes:
      - photo_gallery_data:/data/db
    networks:
      - photo-gallery-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photo-gallery-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: mongodb://mongodb:27017/photo-gallery
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3001}
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-3001}
      API_URL: http://localhost:${BACKEND_PORT:-5000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads/photos}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - photo-gallery-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}/api
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Photo Gallery}
        NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION:-A beautiful photo gallery}
    container_name: photo-gallery-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXTAUTH_URL: http://localhost:${FRONTEND_PORT:-3001}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}/api
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Photo Gallery}
      NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION:-A beautiful photo gallery}
    depends_on:
      - backend
    networks:
      - photo-gallery-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  photo-gallery-network:
    driver: bridge

volumes:
  photo_gallery_data:
    driver: local
